<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- TODO(security): Google Fonts serves UA-specific CSS so static SRI hashes are not supported; self-host woff2 or use @fontsource if strict SRI/CSP is required. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap"
    />
    <script>
      try {
        var s = localStorage.getItem('bwf:color-scheme:v1');
        if (s === 'light' || s === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = s;
        }
      } catch (e) {}
    </script>
    <meta name="description" content="Fetch BWF tournament pages and re-render the times in your local timezone." />
    <title>BWF Local Time</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/__bwf_config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
